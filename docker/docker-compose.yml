services:
  wordpress:
    image: wordpress:${WORDPRESS_IMAGE_TAG:-php8.1-apache}
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:${WP_HTTP_PORT:-8081}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      PARROTPOSTER_DOMAINS: ${PARROTPOSTER_DOMAINS:-http://localhost:3000}
      PARROTPOSTER_LOG_ENABLED: ${PARROTPOSTER_LOG_ENABLED:-false}
      WORDPRESS_CONFIG_EXTRA: |
        define('PARROTPOSTER_DOMAINS', getenv('PARROTPOSTER_DOMAINS'));
        define('PARROTPOSTER_LOG_ENABLED', getenv('PARROTPOSTER_LOG_ENABLED'));
        // Fresh volumes only; existing installs use mu-plugins/00-disable-wp-cron.php
        if (!defined('DISABLE_WP_CRON')) { define('DISABLE_WP_CRON', true); }
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/parrotposter
      - ../logs:/var/www/html/wp-content/plugins/parrotposter/logs
      - ./mu-plugins/00-disable-wp-cron.php:/var/www/html/wp-content/mu-plugins/00-disable-wp-cron.php:ro
      - ./ensure-uploads-writable.sh:/usr/local/bin/ensure-uploads-writable.sh:ro
    # Compose nulls image CMD when entrypoint is overridden — keep apache2-foreground.
    entrypoint: ["/bin/bash", "/usr/local/bin/ensure-uploads-writable.sh"]
    command: ["apache2-foreground"]
    extra_hosts:
      - "pp.l2.vettich.ru:82.146.42.244"
    networks:
      - pp-dev

  # External WP-Cron tick (avoids siteurl self-HTTP / DNS inside wordpress).
  # Hits the WP service on the compose network — same idea as host curl to :WP_HTTP_PORT.
  wp-cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - wordpress
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "wp-cron ticker: http://wordpress/wp-cron.php every 60s"
        while true; do
          curl -fsS --max-time 120 "http://wordpress/wp-cron.php" >/dev/null \
            || echo "wp-cron tick failed at $$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 60
        done
    networks:
      - pp-dev

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - pp-dev

  # One-shot helper: docker compose --profile cli run --rm wpcli <args>
  wpcli:
    image: wordpress:${WPCLI_IMAGE:-cli-php8.1}
    depends_on:
      - wordpress
      - db
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/parrotposter
    networks:
      - pp-dev
    user: "33:33"
    entrypoint: ["wp", "--path=/var/www/html"]
    profiles:
      - cli

volumes:
  wp_data:
  db_data:

networks:
  pp-dev:
