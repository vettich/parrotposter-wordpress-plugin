services:
  wordpress:
    image: wordpress:${WORDPRESS_IMAGE_TAG:-php8.1-apache}
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:${WP_HTTP_PORT:-8081}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/parrotposter
    networks:
      - pp-dev

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - pp-dev

volumes:
  wp_data:
  db_data:

networks:
  pp-dev:
